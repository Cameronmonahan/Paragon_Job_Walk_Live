<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#303030">
<title>Paragon — Job status</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Same Paragon palette as the walk app. Desert Storm paper,
   Mineshaft Black type, Bitter Gold accent, Buff Yellow for
   anything that needs Brandon's eye. */
:root{
  --paper:#F1F1EE; --paper-raised:#FFFFFF;
  --ink:#303030; --ink-soft:#5C5C5C; --ink-faint:#8C8C8C;
  --gold:#8A8C79; --gold-wash:#EAEBE5;
  --buff:#F4D185; --buff-wash:#FDF6E7; --buff-edge:#E8C273;
  --attn:#9A6F1E; --attn-tint:#FBF4E6; --attn-edge:#E6D4AC;
  --rule:#DCDCD6; --radius:4px; --pad:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font-family:'Archivo',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:880px;margin:0 auto;padding-bottom:70px}

/* masthead */
.top{background:var(--ink);color:var(--paper);
  padding:calc(env(safe-area-inset-top) + 26px) var(--pad) 26px}
.top .inner{max-width:880px;margin:0 auto}
.top img{height:34px;margin-bottom:14px;display:block}
.top h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--gold)}
.top p{margin:4px 0 0;font-size:29px;font-weight:600;letter-spacing:-.02em}
.tophead{display:flex;justify-content:space-between;align-items:flex-end;gap:18px}
.addjob{flex:0 0 auto;text-decoration:none;color:var(--paper);
  border:1px solid #5C5C5A;border-radius:var(--radius);
  padding:10px 16px;font-size:15px;font-weight:500;white-space:nowrap}
.addjob:hover{border-color:var(--gold);color:var(--gold)}
.top .date{font-size:15px;font-weight:400;color:#A6A6A0}

/* the headline: one sentence Brandon reads first */
.verdict{padding:26px var(--pad) 8px;font-size:21px;font-weight:500;
  letter-spacing:-.01em;max-width:40ch;line-height:1.35}
.verdict .hl{font-weight:600}
.verdict.attn{padding-left:calc(var(--pad) + 18px);position:relative}
.verdict.attn::before{content:"";position:absolute;left:var(--pad);top:.62em;
  width:8px;height:8px;border-radius:50%;background:var(--attn)}

/* counters */
.counts{display:flex;gap:34px;padding:16px var(--pad) 26px;flex-wrap:wrap}
.count .n{font-size:30px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;
  letter-spacing:-.02em}
.count .l{font-size:12.5px;color:var(--ink-faint);margin-top:4px}
.count.warn .n{color:var(--attn)}

/* job rows */
.jobs{padding:0 var(--pad)}
.jobrow{display:block;width:100%;text-align:left;background:var(--paper-raised);
  border:1px solid var(--rule);border-left:5px solid var(--gold);
  border-radius:var(--radius);padding:17px 18px;margin-bottom:12px}
.jobrow[data-h="warn"]{border-left-color:var(--attn)}
.jobrow[data-h="stale"]{border-left-color:var(--ink-faint)}
.jr-top{display:flex;justify-content:space-between;gap:14px;align-items:baseline}
.jr-name{font-size:19px;font-weight:600;letter-spacing:-.01em}
.jr-pm{font-size:14px;color:var(--ink-faint);white-space:nowrap}
.jr-line{margin-top:9px;font-size:14.5px;color:var(--ink-soft)}
.jr-line b{font-weight:600;color:var(--ink)}
.jr-line .flagbit{color:var(--attn);font-weight:600}
.jr-risk{margin-top:11px;padding-top:11px;border-top:1px solid var(--rule);
  font-size:15px;line-height:1.4}
.jr-risk span{color:var(--ink-faint);font-size:12.5px;display:block;margin-bottom:3px}

/* detail */
.detail{padding:0 var(--pad)}
.back{background:none;border:0;padding:8px 8px 8px 0;color:var(--gold);
  font-size:15px;font-weight:500}
.dhead{padding:20px var(--pad) 0}
.dhead h2{margin:6px 0 2px;font-size:29px;font-weight:600;letter-spacing:-.025em}
.dhead .sub{color:var(--ink-faint);font-size:14.5px}
.block{background:var(--paper-raised);border:1px solid var(--rule);
  border-radius:var(--radius);padding:18px;margin-bottom:14px}
.block h3{margin:0 0 14px;font-size:13px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-faint)}
.qa{margin-bottom:16px}
.qa:last-child{margin-bottom:0}
.qa .q{font-size:13px;color:var(--ink-faint);margin-bottom:3px}
.qa .a{font-size:16px;line-height:1.45}
.flags{display:flex;flex-wrap:wrap;gap:8px}
.flagchip{background:var(--attn-tint);border:1px solid var(--attn-edge);
  border-radius:100px;padding:5px 13px;font-size:14px;font-weight:500;color:var(--ink)}
.issue{display:flex;gap:13px;padding:13px 0;border-bottom:1px solid var(--rule)}
.issue:last-child{border-bottom:0;padding-bottom:0}
.issue img{width:58px;height:58px;object-fit:cover;border-radius:3px;
  flex:0 0 auto;background:var(--paper)}
.issue .t{font-weight:600;line-height:1.3}
.issue .m{font-size:13px;color:var(--ink-faint);margin-top:5px}
.issue .idesc{font-size:14.5px;line-height:1.4;margin-top:4px;color:var(--ink-soft)}
.fixed{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-faint);margin-top:6px}
.late{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--attn);margin-top:6px}
.btn{width:100%;min-height:52px;border-radius:var(--radius);font-weight:600;
  border:1.5px solid var(--ink);background:var(--ink);color:var(--paper)}
.btn.done{background:var(--gold-wash);border-color:var(--rule);color:var(--ink-soft)}
.empty{padding:60px var(--pad);text-align:center;color:var(--ink-soft)}
.screen{display:none}.screen.on{display:block}

/* tabs */
.tabs{display:flex;gap:26px;padding:20px var(--pad) 0;border-bottom:1px solid var(--rule)}
.tab{background:none;border:0;padding:0 0 12px;font-size:16px;font-weight:500;
  color:var(--ink-faint);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}

/* month view */
.monthpick{display:flex;gap:9px;padding:22px var(--pad) 0;flex-wrap:wrap}
.monthpick button{background:var(--paper-raised);border:1.5px solid var(--rule);
  border-radius:var(--radius);padding:9px 15px;font-weight:500}
.monthpick button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.section-h{padding:26px var(--pad) 10px;font-size:13px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
.pmcard{background:var(--paper-raised);border:1px solid var(--rule);
  border-left:5px solid var(--gold);border-radius:var(--radius);
  padding:17px 18px;margin:0 var(--pad) 12px}
.pmcard h4{margin:0 0 13px;font-size:19px;font-weight:600;letter-spacing:-.01em}
.pmstats{display:flex;gap:26px;flex-wrap:wrap}
.pmstat .n{font-size:23px;font-weight:600;line-height:1}
.pmstat .l{font-size:12px;color:var(--ink-faint);margin-top:3px}
.pmstat.warn .n{color:var(--attn)}
.wrow{display:block;width:100%;text-align:left;background:var(--paper-raised);
  border:1px solid var(--rule);border-left:4px solid var(--attn);
  border-radius:var(--radius);padding:14px 16px;margin:0 var(--pad) 11px}
.wrow .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.wrow .jn{font-weight:600;font-size:17px}
.wrow .dt{font-size:13.5px;color:var(--ink-faint);white-space:nowrap}
.wrow.muted{border-left-color:var(--rule);opacity:.65}
.wrow .chips{margin-top:9px;display:flex;flex-wrap:wrap;gap:6px}
.wrow .chip{background:var(--attn-tint);border:1px solid var(--attn-edge);
  border-radius:100px;padding:4px 11px;font-size:13px;color:var(--ink)}
.note{padding:0 var(--pad) 8px;font-size:13.5px;color:var(--ink-faint);max-width:52ch;line-height:1.5}
</style>
</head>
<body>

<div class="top">
  <div class="inner">
    <img src="logo.png" alt="Paragon Homes" onerror="this.remove()">
    <div class="tophead">
      <div>
        <h1>Paragon</h1>
        <p>Job status<span class="date" id="date"></span></p>
      </div>
      <a class="addjob" href="newjob.html">Add job</a>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="tabs">
    <button class="tab on" data-tab="s-list">Now</button>
    <button class="tab" data-tab="s-month">By month</button>
  </div>

  <section class="screen on" id="s-list">
    <div class="verdict" id="verdict"></div>
    <div class="counts" id="counts"></div>
    <div class="jobs" id="jobs"></div>
  </section>

  <section class="screen" id="s-month">
    <div class="monthpick" id="monthpick"></div>
    <div id="month-body"></div>
  </section>

  <section class="screen" id="s-detail">
    <div class="dhead">
      <button class="back" id="back">All jobs</button>
      <h2 id="d-name"></h2>
      <div class="sub" id="d-sub"></div>
    </div>
    <div class="detail" id="d-body"></div>
  </section>
</div>

<script>
const CONFIG = { apiBase: "https://paragon-walks.peakexposure.workers.dev" };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let jobs = [], walks = [], allIssues = [];

async function api(path){
  const r = await fetch(CONFIG.apiBase + path);
  if(!r.ok) throw new Error("Request failed (" + r.status + ")");
  return r.json();
}

function shortName(full){
  const noDate = String(full || "").replace(/^\d{4}-\d{1,2}-\d{1,2}\s+/, "");
  const name = noDate.split(" - ")[0].trim();
  return name.replace(/\S+/g, w =>
    /^\d+$/.test(w) ? w : w[0].toUpperCase() + w.slice(1).toLowerCase());
}

/* Only answers that indicate a problem. A clean walk shows nothing here,
   which is the point — Brandon reads exceptions, not transcripts. */
const FLAGGED = [
  ["Site Clean and Organized","No","Site not clean"],
  ["Surfaces Protected","No","Surfaces unprotected"],
  ["Every Room Walked","No","Not every room walked"],
  ["Damage Since Last Walk","Damage found","New damage"],
  ["Would Brandon Approve","No","Work not up to standard"],
  ["Paint and Touch-Up","Defects found","Paint defects"],
  ["Trim and Finish Carpentry","Defects found","Trim defects"],
  ["Fixtures Installed and Working","Defects found","Fixture defects"],
  ["Flooring","Defects found","Flooring defects"],
  ["Cabinets and Hardware","Defects found","Cabinet defects"],
  ["Schedule Status","Behind","Behind schedule"],
  ["Materials Onsite","Missing or wrong","Materials missing or wrong"],
  ["Previous Trade Complete","No","Previous trade unfinished"],
  ["Next Trade Ready","Blocked","Next trade blocked"],
  ["Inspections","Not scheduled","Inspection not scheduled"]
];
const flagsOn = f => FLAGGED.filter(([k,v]) => f[k] === v).map(([,,label]) => label);

async function load(){
  $("date").textContent = " · " + new Date().toLocaleDateString(undefined,
    {weekday:"long", month:"long", day:"numeric"});
  try{
    const [j, w, i] = await Promise.all([
      api("/jobs"), api("/walks?limit=200"), api("/all-issues")
    ]);
    jobs = j.records || [];
    walks = w.records || [];
    allIssues = i.records || [];
    render();
  }catch(e){
    $("jobs").innerHTML = '<div class="empty"><p>Couldn\'t load job data.</p>' +
      '<p style="font-size:14px">' + esc(e.message) + '</p></div>';
  }
}

// /walks comes back newest-first, so the first match is the latest walk.
const latestWalk = jobId => walks.find(w => (w.fields["Job"] || []).includes(jobId));
const isOpen = i => i.fields["Status"] !== "Verified closed";
const issuesFor = jobId =>
  allIssues.filter(i => (i.fields["Job"] || []).includes(jobId) && isOpen(i));

/* One issue, rendered. `closed` shows the status so Brandon can see what was
   found on a walk even after it's been fixed. */
function issueRow(i, showStatus){
  const f = i.fields;
  const photo = (f["Photo"] || [])[0];
  const thumb = photo && photo.thumbnails ? photo.thumbnails.small.url : null;
  const meta = [f["Responsible Party"] || "Unassigned",
    f["Promised Fix Date"] ? "due " + f["Promised Fix Date"] : null,
    f["Severity"] || null].filter(Boolean).join(" \u00b7 ");
  return '<div class="issue">' +
    (thumb ? '<img src="' + thumb + '" alt="">' : '<img alt="">') +
    '<div><div class="t">' + esc(f["Issue"]) + '</div>' +
    (f["Description"] ? '<div class="idesc">' + esc(f["Description"]) + '</div>' : '') +
    '<div class="m">' + esc(meta) + '</div>' +
    (f["Overdue"] === "Overdue" ? '<span class="late">Past due</span>' : '') +
    (showStatus && !isOpen(i) ? '<span class="fixed">Fixed and verified</span>' : '') +
    '</div></div>';
}

function render(){
  const rows = jobs.map(j => {
    const f = j.fields;
    const name = f["Job Name"];
    const w = latestWalk(j.id);
    const wf = w ? w.fields : {};
    const flags = w ? flagsOn(wf) : [];
    const days = f["Days Since Walk"] ?? 999;
    const open = f["Open Issues"] || 0;
    const overdue = f["Overdue Issues"] || 0;
    const clientDays = f["Days Since Client Update"] ?? 999;
    const reviewed = !!wf["Brandon Reviewed"];
    // A flag is a fact about the walk and never goes away. What changes is
    // whether it still needs Brandon — once he's seen it and nothing is open,
    // the job is off his list.
    const health = (overdue > 0) ? "warn"
                 : (flags.length && !reviewed) ? "warn"
                 : (days > 7) ? "stale" : "ok";
    return {id:j.id, name, pm:f["Assigned PM"] || "Unassigned", days, open, overdue,
            clientDays, flags, walk:w, health, reviewed};
  });

  rows.sort((a,b) => ({warn:0,stale:1,ok:2}[a.health] - {warn:0,stale:1,ok:2}[b.health]));

  const needy = rows.filter(r => r.health !== "ok");
  $("verdict").className = "verdict" + (needy.length ? " attn" : "");
  $("verdict").innerHTML = needy.length
    ? `<span class="hl">${needy.length} of ${rows.length} ${needy.length === 1 ? "job needs" : "jobs need"} your attention.</span>`
    : `All ${rows.length} jobs are on track. Nothing needs you today.`;

  const totOpen = rows.reduce((n,r) => n + r.open, 0);
  const totLate = rows.reduce((n,r) => n + r.overdue, 0);
  const noWalk = rows.filter(r => r.days > 7).length;
  const quiet = rows.filter(r => r.clientDays > 4).length;
  $("counts").innerHTML = [
    ["Open issues", totOpen, totOpen > 0],
    ["Past due", totLate, totLate > 0],
    ["No walk this week", noWalk, noWalk > 0],
    ["Clients gone quiet", quiet, quiet > 0]
  ].map(([l,n,w]) =>
    `<div class="count ${w ? "warn" : ""}"><div class="n">${n}</div><div class="l">${l}</div></div>`
  ).join("");

  $("jobs").innerHTML = rows.map(r => {
    const bits = [];
    if(r.open) bits.push(`<b>${r.open}</b> open ${r.open === 1 ? "issue" : "issues"}`);
    if(r.overdue) bits.push(`<span class="flagbit">${r.overdue} past due</span>`);
    if(r.flags.length) bits.push(r.reviewed
      ? `${r.flags.length} flagged (reviewed)`
      : `<span class="flagbit">${r.flags.length} flagged</span>`);
    bits.push(r.days > 900 ? "never walked"
      : r.days === 0 ? "walked today" : `walked ${r.days}d ago`);
    if(r.clientDays > 4 && r.clientDays < 900) bits.push(`client quiet ${r.clientDays}d`);
    const risk = r.walk && r.walk.fields["Biggest Risk Right Now"];
    return `<button class="jobrow" data-h="${r.health}" data-id="${r.id}">
      <div class="jr-top">
        <span class="jr-name">${esc(shortName(r.name))}</span>
        <span class="jr-pm">${esc(r.pm)}</span>
      </div>
      <div class="jr-line">${bits.join(" · ")}</div>
      ${risk ? `<div class="jr-risk"><span>Biggest risk</span>${esc(risk)}</div>` : ""}
    </button>`;
  }).join("");

  document.querySelectorAll(".jobrow").forEach(el =>
    el.onclick = () => openJob(rows.find(r => r.id === el.dataset.id)));
}

function openJob(r){
  openWalk(r.walk, jobs.find(j => j.id === r.id), r);
}

/* Any walk, current or historical. `row` is the list row when we have it. */
function openWalk(walk, jobRec, row){
  const jobId = jobRec ? jobRec.id : (walk && (walk.fields["Job"] || [])[0]);
  const jobName = jobRec ? jobRec.fields["Job Name"] : (row && row.name) || "";
  const pm = (walk && walk.fields["PM"]) ||
             (jobRec && jobRec.fields["Assigned PM"]) || "Unassigned";

  $("d-name").textContent = shortName(jobName);
  $("d-sub").textContent = pm + (walk
    ? " · walked " + (walk.fields["Walk Date"] || "")
    : " · no walk recorded");

  if(!walk){
    $("d-body").innerHTML = '<div class="empty">No walk has been submitted for this job yet.</div>';
    return show("s-detail");
  }

  const r = { id:jobId, name:jobName, pm, walk };
  const f = walk.fields;
  const flags = flagsOn(f);
  const notes = [
    ["What should have been done since last visit", f["Expected vs Actual"]],
    ["Open client decisions", f["Open Client Decisions"]],
    ["What slipped and the recovery plan", f["Schedule Detail"]],
    ["What's blocking the next trade", f["What Is Blocking"]],
    ["What the trades said they're waiting on", f["What Trades Said"]],
    ["What the client owes us this week", f["Client Action Items"]],
    ["Biggest risk right now", f["Biggest Risk Right Now"]],
    ["Anything else for you", f["Anything Brandon Should See"]]
  ].filter(([,v]) => v && String(v).trim());

  const openList = issuesFor(jobId);

  let html = "";

  if(flags.length){
    html += `<div class="block"><h3>Flagged this walk</h3>
      <div class="flags">${flags.map(x => `<span class="flagchip">${esc(x)}</span>`).join("")}</div>
    </div>`;
  }

  if(openList.length){
    html += `<div class="block"><h3>Open issues</h3>` +
      openList.map(i => issueRow(i, false)).join("") + `</div>`;
  }

  // What this walk turned up, whether or not it's since been closed.
  const loggedIds = f["Issues Logged"] || [];
  const logged = allIssues.filter(i => loggedIds.includes(i.id));
  if(logged.length){
    html += `<div class="block"><h3>Found on this walk</h3>` +
      logged.map(i => issueRow(i, true)).join("") + `</div>`;
  }

  if(notes.length){
    html += `<div class="block"><h3>From the walk</h3>` + notes.map(([q,a]) =>
      `<div class="qa"><div class="q">${esc(q)}</div><div class="a">${esc(a)}</div></div>`
    ).join("") + `</div>`;
  }

  if(!flags.length && !openList.length && !logged.length && !notes.length){
    html += `<div class="empty">Clean walk. Nothing outstanding on this job.</div>`;
  }

  const reviewed = f["Brandon Reviewed"];
  html += `<button class="btn ${reviewed ? "done" : ""}" id="review-btn" ${reviewed ? "disabled" : ""}>
    ${reviewed ? "Reviewed" : "Mark reviewed"}</button>`;

  $("d-body").innerHTML = html;
  const rb = $("review-btn");
  if(rb && !reviewed) rb.onclick = async () => {
    rb.disabled = true; rb.textContent = "Saving…";
    try{
      const resp = await fetch(CONFIG.apiBase + "/review", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ id:r.walk.id, reviewed:true })
      });
      if(!resp.ok) throw new Error("server said " + resp.status);
      rb.className = "btn done"; rb.textContent = "Reviewed";
      // update in place so the list is right when he backs out
      const w = walks.find(x => x.id === r.walk.id);
      if(w) w.fields["Brandon Reviewed"] = true;
      render();
    }catch(e){
      rb.disabled = false; rb.textContent = "Mark reviewed";
      alert("Couldn't save that: " + e.message);
    }
  };
  show("s-detail");
}


/* ── month review ─────────────────────────────────────────────
   Deliberately not a flag leaderboard. A PM who finds more problems
   is doing the job, not failing at it. What's worth measuring is
   whether walks happened and whether promised fixes landed. */

let monthOffset = 0;   // 0 = this month, 1 = last, 2 = the one before

const monthKey = d => String(d).slice(0, 7);
function monthFor(offset){
  const d = new Date();
  d.setDate(1); d.setMonth(d.getMonth() - offset);
  return { key: d.toISOString().slice(0, 7),
           label: d.toLocaleDateString(undefined, {month:"long", year:"numeric"}) };
}

function renderMonth(){
  const m = monthFor(monthOffset);

  $("monthpick").innerHTML = [0,1,2].map(o => {
    const mm = monthFor(o);
    return '<button data-mo="' + o + '" aria-pressed="' + (o === monthOffset) + '">' +
      esc(mm.label) + '</button>';
  }).join("");
  $("monthpick").querySelectorAll("[data-mo]").forEach(b => b.onclick = () => {
    monthOffset = +b.dataset.mo; renderMonth();
  });

  const jobById = Object.fromEntries(jobs.map(j => [j.id, j.fields["Job Name"]]));
  const inMonth = walks.filter(w => monthKey(w.fields["Walk Date"]) === m.key);
  const walkById = Object.fromEntries(inMonth.map(w => [w.id, w]));
  const walkIds = new Set(inMonth.map(w => w.id));

  const raised = allIssues.filter(i =>
    (i.fields["Logged On Walk"] || []).some(id => walkIds.has(id)));
  const still = raised.filter(isOpen);
  const done  = raised.filter(i => !isOpen(i));
  const unreviewed = inMonth.filter(w =>
    flagsOn(w.fields).length && !w.fields["Brandon Reviewed"]);

  if(!inMonth.length){
    $("month-body").innerHTML = '<div class="empty">No walks recorded in ' + esc(m.label) + '.</div>';
    return;
  }

  let html = '<div class="verdict' +
    ((still.length || unreviewed.length) ? " attn" : "") + '">' + (
    still.length || unreviewed.length
      ? '<span class="hl">' + (still.length + unreviewed.length) +
        (still.length + unreviewed.length === 1 ? ' thing still needs' : ' things still need') +
        ' closing out.</span>'
      : 'Everything raised in ' + esc(m.label) + ' has been handled.'
  ) + '</div>';

  const jobOf = i => shortName(jobById[(i.fields["Job"] || [])[0]] || "");
  const walkOf = i => (i.fields["Logged On Walk"] || [])[0];

  const issueRowBtn = (i, muted) => {
    const f = i.fields;
    const meta = [jobOf(i), f["Responsible Party"] || "Unassigned",
      f["Promised Fix Date"] ? "due " + f["Promised Fix Date"] : null
    ].filter(Boolean).join(" \u00b7 ");
    return '<button class="wrow' + (muted ? " muted" : "") + '" data-walk="' + walkOf(i) + '">' +
      '<div class="top"><span class="jn">' + esc(f["Issue"]) + '</span>' +
      (f["Overdue"] === "Overdue" ? '<span class="late">Past due</span>' :
       muted ? '<span class="dt">Fixed</span>' : '') + '</div>' +
      '<div class="dt" style="margin-top:6px">' + esc(meta) + '</div></button>';
  };

  if(still.length){
    html += '<div class="section-h">Still open (' + still.length + ')</div>';
    html += still.map(i => issueRowBtn(i, false)).join("");
  }

  if(unreviewed.length){
    html += '<div class="section-h">Walks you haven\u2019t reviewed (' + unreviewed.length + ')</div>';
    html += unreviewed.map(w => {
      const jid = (w.fields["Job"] || [])[0];
      return '<button class="wrow" data-walk="' + w.id + '">' +
        '<div class="top"><span class="jn">' + esc(shortName(jobById[jid] || "")) + '</span>' +
        '<span class="dt">' + esc(w.fields["PM"] || "") + ' \u00b7 ' + esc(w.fields["Walk Date"] || "") + '</span></div>' +
        '<div class="chips">' + flagsOn(w.fields).map(x =>
          '<span class="chip">' + esc(x) + '</span>').join("") + '</div></button>';
    }).join("");
  }

  if(done.length){
    html += '<div class="section-h">Handled (' + done.length + ')</div>';
    html += done.map(i => issueRowBtn(i, true)).join("");
  }

  html += '<div class="section-h">The month</div>' +
    '<div class="note">' + inMonth.length + ' walk' + (inMonth.length === 1 ? "" : "s") +
    ' across ' + new Set(inMonth.map(w => (w.fields["Job"] || [])[0])).size + ' job' +
    (new Set(inMonth.map(w => (w.fields["Job"] || [])[0])).size === 1 ? "" : "s") +
    ' \u00b7 ' + raised.length + ' issue' + (raised.length === 1 ? "" : "s") + ' raised \u00b7 ' +
    done.length + ' closed out.</div>';

  $("month-body").innerHTML = html;
  $("month-body").querySelectorAll("[data-walk]").forEach(b => b.onclick = () => {
    const w = walks.find(x => x.id === b.dataset.walk);
    if(!w) return;
    const j = jobs.find(x => x.id === (w.fields["Job"] || [])[0]);
    openWalk(w, j);
  });
}

document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("on"));
  t.classList.add("on");
  show(t.dataset.tab);
  if(t.dataset.tab === "s-month") renderMonth();
});

$("back").onclick = () => {
  const active = document.querySelector(".tab.on");
  show(active ? active.dataset.tab : "s-list");
  window.scrollTo(0,0);
};

function show(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("on"));
  $(id).classList.add("on");
  window.scrollTo(0,0);
}

load();
</script>
</body>
</html>
